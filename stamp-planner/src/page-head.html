<title>Stamp Upgrade Planner</title>
<link rel="icon" href="../assets/favicon.png" type="image/png">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/site.js" data-page="stamps"></script>
<style>
/* Layout: one working column — status strip, carry-cap verdicts, then the sortable upgrade table. */
:root{
  --panel:var(--surface); --ink:var(--fg);
  --gold:#a8730c; --gold-soft:#f6ead0; --hydro:#0f7c94; --hydro-soft:#dcf0f4;
  --ok:#1f7a45; --ok-soft:#dcf1e4; --warn:#9a5b00; --warn-soft:#fbecd2; --bad:#b0322e; --bad-soft:#f8dedc;
  --f-display:var(--font-display); --f-body:var(--font-body); --f-mono:var(--font-mono);
  --t-material:#2f7f7a; --t-logs:#8a5a2b; --t-leaf:#3f8a2e; --t-ore:#b0612a; --t-bars:#5b6f86; --t-fish:#1f6fb5;
  --t-bugs:#8a8a12; --t-critters:#b05a7a; --t-souls:#7a4fc0; --t-food:#c0442b; --t-gear:#56606e; --t-stone:#6a58a8; --t-other:#7a7062;
  --exalt:#b0389a; --exalt-soft:#f7e1f2;
  --t-rare:#c81e3a; --t-rare-ink:#ffffff;
  --t-spel:#8a6a2b; --t-shop:#4256b8;
  --well:#1f2b3a; --well-edge:#1f2b3a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --gold:#e3b04b; --gold-soft:#3a2f17; --hydro:#5cc3d8; --hydro-soft:#15323a;
  --ok:#5fcf8b; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f07f78; --bad-soft:#3c1d1c;
  --t-material:#5fc4bd; --t-logs:#d39a5c; --t-leaf:#7fcf63; --t-ore:#f09a5a; --t-bars:#a3b6cc; --t-fish:#6ab3f0;
  --t-bugs:#d3d150; --t-critters:#ec93b4; --t-souls:#b896f2; --t-food:#f2836a; --t-gear:#a5afbd; --t-stone:#ab9bea; --t-other:#bcb2a3;
  --exalt:#ec84d6; --exalt-soft:#3c1d36;
  --t-rare:#ff5c77; --t-rare-ink:#1a0a0e;
  --t-spel:#d8b26a; --t-shop:#98a8f5;
  --well:#0c1118; --well-edge:#3a4656;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --gold:#e3b04b; --gold-soft:#3a2f17; --hydro:#5cc3d8; --hydro-soft:#15323a;
  --ok:#5fcf8b; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f07f78; --bad-soft:#3c1d1c;
  --t-material:#5fc4bd; --t-logs:#d39a5c; --t-leaf:#7fcf63; --t-ore:#f09a5a; --t-bars:#a3b6cc; --t-fish:#6ab3f0;
  --t-bugs:#d3d150; --t-critters:#ec93b4; --t-souls:#b896f2; --t-food:#f2836a; --t-gear:#a5afbd; --t-stone:#ab9bea; --t-other:#bcb2a3;
  --exalt:#ec84d6; --exalt-soft:#3c1d36;
  --t-rare:#ff5c77; --t-rare-ink:#1a0a0e;
  --t-spel:#d8b26a; --t-shop:#98a8f5;
  --well:#0c1118; --well-edge:#3a4656;
  color-scheme:dark}
.wrap{max-width:none;margin:0 auto;padding-inline:clamp(16px,2.5vw,40px);padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
h2{font-size:1.3rem}
p{margin:0;max-width:72ch}
.muted{color:var(--muted)}
.mono,td.num,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fact .v{font-family:var(--f-display);font-size:22px;font-weight:600}
.fact .s{font-size:13px;color:var(--muted)}
.fact.carriers{grid-column:1/-1}
.carry-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 24px;margin:6px 0 4px;font-size:13px;font-variant-numeric:tabular-nums}
.carry-list .ci{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}
.carry-list .lbl{color:var(--muted)}
.carry-list .cap{font-family:var(--f-mono);font-weight:600;text-align:right}
.carry-list .who{grid-column:1/-1;font-size:12px}
.reducers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.red{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hydro);border-radius:6px;padding:14px 16px;min-width:0}
.red.g{border-left-color:var(--gold)}
.meritctl{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border:1px solid var(--exalt);background:var(--exalt-soft);border-radius:6px;padding:8px 12px;font-size:13px}
.meritctl img{width:24px;height:24px;object-fit:contain}
.meritctl b{color:var(--exalt);font-family:var(--f-mono)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked + .track{background:var(--exalt)}
.switch input:checked + .track::after{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.switch input:disabled + .track{opacity:.6}
.redimg{display:grid;place-items:center;width:64px;height:64px;border-radius:8px;background:var(--hydro-soft)}
.red.g .redimg{background:var(--gold-soft)}
.redimg img{max-width:48px;max-height:48px;object-fit:contain}
.redbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.red .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.red .v{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.1;color:var(--hydro);font-variant-numeric:tabular-nums}
.red.g .v{color:var(--gold)}
.red .v .of{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.red .s{font-size:13px;color:var(--muted)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--line);margin:4px 0 2px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--hydro);min-width:0}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.6}
section{display:flex;flex-direction:column;gap:12px}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
/* Auto layout: columns take their natural width and only wrap when the screen runs out of room. */
table{border-collapse:collapse;width:100%;min-width:760px;table-layout:auto}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:normal;vertical-align:bottom;line-height:1.3;background:var(--panel);position:sticky;top:0}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
th.num,td.num{text-align:right}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.name{font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px;min-width:70px}
.bar i{display:block;height:100%;background:var(--hydro)}
.bar i.over{background:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button + button{border-left:0}
.seg.g button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px}
.ctl .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;width:180px}
button:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.path{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.path li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.path .n{font-family:var(--f-display);font-weight:700;color:var(--gold)}
.notes{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}
.notes p{max-width:90ch}
.summary{font-size:13px;color:var(--muted)}
.ico{width:44px;height:44px;object-fit:contain;image-rendering:auto;flex:none}
.ico.sm{width:36px;height:36px}
.cell{display:flex;gap:10px;align-items:center;min-width:0}
.cell > span{min-width:0}
.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.55;cursor:progress}
.status{font-size:13px;color:var(--muted)} .status.err{color:var(--bad)} .status.ok{color:var(--ok)}
.flag{font:inherit;font-size:20px;line-height:1;width:30px;height:30px;flex:none;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.flag:hover{background:var(--gold-soft);color:var(--gold)}
.flag.on{color:var(--gold)}
tr.pri td{background:var(--gold-soft)}
tr.group td{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--gold);padding-top:12px;background:var(--panel)}
.type{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:normal;max-width:8em;line-height:1.25;text-align:center}
.type{--tc:var(--t-other);color:var(--tc);border-color:color-mix(in srgb, var(--tc) 45%, transparent);background:color-mix(in srgb, var(--tc) 13%, var(--panel))}
.type[data-t="Material"]{--tc:var(--t-material)} .type[data-t="Logs"]{--tc:var(--t-logs)} .type[data-t="Leaf"]{--tc:var(--t-leaf)}
.type[data-t="Ore"]{--tc:var(--t-ore)} .type[data-t="Bars"],.type[data-t="Oil"]{--tc:var(--t-bars)} .type[data-t="Fish"]{--tc:var(--t-fish)}
.type[data-t="Bugs"]{--tc:var(--t-bugs)} .type[data-t="Critters"]{--tc:var(--t-critters)} .type[data-t="Souls"]{--tc:var(--t-souls)}
.type[data-t="Food"]{--tc:var(--t-food)} .type[data-t="Rare Drop"]{background:var(--t-rare);color:var(--t-rare-ink);border-color:var(--t-rare)}
.type[data-t="Spelunking Chapter"]{--tc:var(--t-spel)} .type[data-t="Shop Item"]{--tc:var(--t-shop)}
.type[data-t="W7 Drop (no candy)"]{--tc:var(--warn);border-style:dashed} .type[data-t="Gear"]{--tc:var(--t-gear)} .type[data-t="Upgrade Stone"],.type[data-t="Statue"]{--tc:var(--t-stone)}
.xbadge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--exalt-soft);color:var(--exalt);vertical-align:1px}
.ico.ex{border-radius:8px;box-shadow:0 0 0 2px var(--exalt);background:var(--exalt-soft)}
.fact.x .v{color:var(--exalt)}
.short{color:var(--bad);font-weight:600}
.coins{display:inline-flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.coin{display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.coin img{width:18px;height:21px;object-fit:contain;image-rendering:auto}
.fact .v .coin img{width:24px;height:28px}
.fact .v .coins{justify-content:flex-start}
.alert{border:2px solid var(--bad);border-radius:8px;padding:14px;background:color-mix(in srgb, var(--bad-soft) 55%, var(--bg))}
.alert .tablebox{border-color:color-mix(in srgb, var(--bad) 45%, var(--line))}
.alert-head{display:flex;gap:10px;align-items:center}
.alert-icon{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bad);color:var(--panel);font-family:var(--f-display);font-weight:700;flex:none}
.alert h2{color:var(--bad)}
.empty{display:flex;flex-direction:column;gap:4px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);border-radius:6px;padding:14px}
.empty[hidden]{display:none}
.fitcounts{display:flex;flex-wrap:wrap;gap:8px}
.fitcounts{flex-basis:100%}
.fc{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--bg);cursor:pointer}
.fc:hover{border-color:var(--accent);color:var(--ink)}
.fc b{font-family:var(--f-mono);color:var(--ink);font-weight:600;margin-right:2px}
.fc.gold b{color:var(--gold)}
.fc{display:inline-flex;align-items:center;gap:8px}
.fci{display:inline-flex;align-items:center;gap:3px}
.well{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--well);box-shadow:inset 0 0 0 1px var(--well-edge)}
.well img{width:22px;height:22px;object-fit:contain;image-rendering:auto}
.fci img.gs{width:24px;height:24px;object-fit:contain;image-rendering:auto}
.lbl-st{margin-left:-4px}
.fc.custom{border-style:dashed}
.fc.custom[aria-pressed="true"]{border-style:solid}
.fc .ctag{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.customctl{flex-basis:100%;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:13px}
.customctl .lbl{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.customctl img{width:22px;height:22px;object-fit:contain}
.customctl input[type=number]{font:inherit;font-family:var(--f-mono);width:5.5em;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);text-align:right}
.fci img.atom{width:22px;height:22px;object-fit:contain;image-rendering:auto}
.fc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
input.rate{display:block;margin:0 0 6px auto;text-align:right;width:7.5em;font:inherit;font-family:var(--f-mono);font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input.rate::placeholder{color:var(--muted);font-family:var(--f-body)}
input.rate.bad{border-color:var(--bad)}
td.farm .sub:first-child{margin-top:0}
td.farm .sub{margin-top:4px}
.alert-head{flex-wrap:wrap}
.alert-toggle{margin-left:auto}
.carry-hidden{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px 12px}
@media (max-width:560px){.path li{grid-template-columns:24px 1fr}.path li .num{grid-column:2}}
</style>
